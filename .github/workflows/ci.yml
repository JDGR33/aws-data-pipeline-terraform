name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Automatically cancel redundant in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Python Testing, Linting & Lambda Packaging
  # ============================================================================
  python-ci:
    name: Python Lint, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt
          pip install flake8

      - name: Verify Python Syntax Across All Code
        run: |
          python -m py_compile collector/*.py scripts/*.py glue/*.py

      - name: Flake8 Critical Error Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 collector/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Unit Test Suite
        run: |
          python -m unittest discover tests/

      - name: Build & Package Lambda Artifact
        run: |
          python scripts/package_lambda.py
          ls -lh dist/collector_lambda.zip

      - name: Upload Lambda Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: collector-lambda-zip
          path: dist/collector_lambda.zip
          retention-days: 1

  # ============================================================================
  # Job 2: Infrastructure as Code (Terraform) Quality & Validation
  # ============================================================================
  terraform-ci:
    name: Terraform Format & Validate
    needs: python-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Lambda Artifact
        uses: actions/download-artifact@v4
        with:
          name: collector-lambda-zip
          path: dist/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Enforce Canonical Terraform Formatting
        run: |
          terraform fmt -check -recursive

      - name: Validate Production Infrastructure (envs/prod)
        run: |
          terraform -chdir=envs/prod init -backend=false
          terraform -chdir=envs/prod validate

      - name: Validate Development Infrastructure (envs/dev)
        run: |
          terraform -chdir=envs/dev init -backend=false
          terraform -chdir=envs/dev validate
